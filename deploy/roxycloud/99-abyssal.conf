# Conservative low-latency network defaults for the RoxyCloud Ryzen 4GB VPS.
# Apply with: sudo cp deploy/roxycloud/99-abyssal.conf /etc/sysctl.d/ && sudo sysctl --system
fs.file-max = 2097152
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
vm.swappiness = 10
