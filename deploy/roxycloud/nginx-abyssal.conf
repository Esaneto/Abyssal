# Install as /etc/nginx/sites-available/abyssal and replace
# __ABYSSAL_DOMAIN__ with the production domain before enabling it.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream abyssal_node {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name __ABYSSAL_DOMAIN__;

    root /opt/abyssal/public;
    client_max_body_size 128k;
    keepalive_timeout 30s;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    location /socket.io/ {
        proxy_pass http://abyssal_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location = /health {
        proxy_pass http://abyssal_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://abyssal_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # HTML remains behind Node so the application keeps its CSP and security headers.
    location ~* \.(?:css|js)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        try_files $uri @abyssal_app;
    }

    location ~* \.(?:png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf|mp3|ogg|wav)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri @abyssal_app;
    }

    location / {
        proxy_pass http://abyssal_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location @abyssal_app {
        proxy_pass http://abyssal_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
