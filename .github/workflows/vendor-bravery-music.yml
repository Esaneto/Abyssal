name: Vendor verified CC0 music for Abyssal
on:
  push:
    branches:
      - feature/bravery-demon-cockpit-20261122
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor-music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Download and verify original Bravery Demon asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/audio/music
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 --output public/audio/music/bravery_demon_bpm210.ogg https://opengameart.org/sites/default/files/bravery_demon_bpm210_0.ogg
          echo '757202f3f07ddb0fcadaf94323ec22457f07f3ae81e7b3b9c9328ad1a00cbcdd  public/audio/music/bravery_demon_bpm210.ogg' | sha256sum --check
      - name: Retire old track only after new file is verified
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch public/audio/music/musica.mp3
          git add public/audio/music/bravery_demon_bpm210.ogg
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "assets: install verified Bravery Demon soundtrack"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
