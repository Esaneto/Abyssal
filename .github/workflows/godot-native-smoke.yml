name: Godot Native Client Smoke

on:
  push:
    paths:
      - 'godot-client/**'
      - '.github/workflows/godot-native-smoke.yml'
  pull_request:
    paths:
      - 'godot-client/**'
      - '.github/workflows/godot-native-smoke.yml'
  workflow_dispatch:

jobs:
  godot-4-7:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --headless --version
      - name: Import project resources and parse scripts
        run: ./godot --headless --path godot-client --editor --import
      - name: Verify cabin, ocean, diver and fauna
        run: ./godot --headless --path godot-client --script res://scripts/ci_smoke.gd
