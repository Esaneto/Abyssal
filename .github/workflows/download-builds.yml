name: Abyssal Windows stable build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate shared game
        run: |
          npm ci
          npm test
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Validate desktop entrypoint
        run: node --check desktop/main.cjs
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
      - name: Upload Windows validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: abyssal-windows-installer
          path: desktop/dist/Abyssal-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Promote validated installer to stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload downloads-1 desktop/dist/Abyssal-Setup.exe --clobber
