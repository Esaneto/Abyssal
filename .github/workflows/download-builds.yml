name: Abyssal downloadable builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "mobile/**"
      - ".github/workflows/download-builds.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: abyssal-windows-installer
          path: desktop/dist/Abyssal-Setup.exe
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install
      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: abyssal-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-downloads:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: abyssal-windows-installer
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: abyssal-android-apk
          path: release-assets/android
      - name: Rename Android package
        run: mv release-assets/android/app-debug.apk release-assets/android/Abyssal-Android.apk
      - name: Publish downloadable builds
        uses: softprops/action-gh-release@v2
        with:
          tag_name: downloads-${{ github.run_number }}
          name: Abyssal Downloads ${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/windows/Abyssal-Setup.exe
            release-assets/android/Abyssal-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}