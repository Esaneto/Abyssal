name: Abyssal Windows stable build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate shared game
        run: |
          npm ci
          npm test
      - name: Install pinned icon renderer
        run: npm install --no-save --package-lock=false sharp@0.34.4
      - name: Create Windows application, shortcut and installer icon
        run: node scripts/build-app-icons.cjs --desktop
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Validate desktop entrypoint
        run: node --check desktop/main.cjs
      - name: Build Windows installer
        working-directory: desktop
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist
      - name: Verify offline game is bundled inside Windows app
        shell: pwsh
        run: |
          $root = "desktop/dist/win-unpacked/resources/offline-web"
          foreach ($asset in @("index.html", "game.js", "offline-ui.js", "abyssal-map.js")) {
            $file = Join-Path $root $asset
            if (-not (Test-Path $file)) { throw "Missing offline Windows asset: $file" }
          }
          Write-Host "Offline single-player game is packaged with Windows installer."
      - name: Verify embedded Abyssal icon on EXE and installer
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          foreach ($file in @("desktop/dist/win-unpacked/Abyssal.exe", "desktop/dist/Abyssal-Setup.exe")) {
            if (-not (Test-Path $file)) { throw "Missing Windows binary: $file" }
            $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $file).Path)
            if ($null -eq $icon) { throw "Windows executable has no icon: $file" }
            $bitmap = $icon.ToBitmap()
            $violet = 0
            for ($y = 0; $y -lt $bitmap.Height; $y++) {
              for ($x = 0; $x -lt $bitmap.Width; $x++) {
                $pixel = $bitmap.GetPixel($x, $y)
                if ($pixel.A -gt 95 -and $pixel.R -gt 75 -and $pixel.B -gt 95 -and
                    $pixel.R -gt ($pixel.G * 1.20) -and $pixel.B -gt ($pixel.G * 1.24)) { $violet++ }
              }
            }
            Write-Host "Native icon: $file, $violet violet pixels at $($bitmap.Width)x$($bitmap.Height)"
            $bitmap.Dispose()
            $icon.Dispose()
            if ($violet -lt 3) { throw "Custom violet Abyssal anchor icon was not embedded in $file" }
          }
      - name: Verify Windows signature when certificate is configured
        if: env.WIN_CSC_LINK != ''
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          $sig = Get-AuthenticodeSignature "desktop/dist/Abyssal-Setup.exe"
          Write-Host "Signature status: $($sig.Status)"
          if ($sig.Status -ne "Valid") { throw "Abyssal installer signature is not valid." }
      - name: Upload Windows validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: abyssal-windows-installer
          path: desktop/dist/Abyssal-Setup.exe
          if-no-files-found: error
          retention-days: 3
      - name: Promote validated installer to stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload downloads-1 desktop/dist/Abyssal-Setup.exe --clobber
