name: Install Abyssal Dark Fantasy sprites
on:
  push:
    branches: [main]
    paths:
      - 'artifacts/abyssal_ecos_integracao_assets.zip'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: abyssal-horror-assets
  cancel-in-progress: false
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and extract the 26 animation atlases
        run: python3 scripts/install-horror-atlases.py --archive artifacts/abyssal_ecos_integracao_assets.zip --root .
      - name: Validate JavaScript and existing animation regression tests
        run: |
          node --check public/game.js
          node --check public/abyssal-horror-sprite-bridge.js
          node --test tests/horror-sprite-bridge.test.cjs tests/animated-shark-ecos.test.cjs
      - name: Publish only the validated atlases
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/abyssal-horror/
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
          else
            git commit -m 'Install validated dark fantasy Solo/Online and Eco atlases'
            git push origin HEAD:main
          fi
