name: Abyssal checks v2

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Android configurator syntax
        run: node --check scripts/configure-android.cjs
      - name: Check JavaScript syntax and title definitions
        run: npm test

  android-api36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        run: |\n          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"\n          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $ANDROID_HOME"; find "$ANDROID_HOME" -maxdepth 4 -type f | head -200; exit 1; }\n          yes | "$SDKMANAGER" --licenses >/dev/null || true\n          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Install server dependencies
        run: npm ci
      - name: Install Capacitor tooling
        run: npm install --no-save --package-lock=false @capacitor/core@8 @capacitor/android@8 @capacitor/cli@8
      - name: Generate Android project
        run: npx cap add android
      - name: Force API 36
        run: |
          sed -i "s/minSdkVersion = .*/minSdkVersion = 24/" android/variables.gradle
          sed -i "s/compileSdkVersion = .*/compileSdkVersion = 36/" android/variables.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = 36/" android/variables.gradle
      - name: Configure Android runtime
        run: node scripts/configure-android.cjs
      - name: Sync game assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abyssal-android-api36-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Preserve Android build metadata
        run: |
          echo "commit=$GITHUB_SHA" > android-build.txt
          echo "targetSdk=36" >> android-build.txt
          echo "artifact=abyssal-android-api36-debug" >> android-build.txt
      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: abyssal-android-build-metadata
          path: android-build.txt
