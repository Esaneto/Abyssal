name: Abyssal checks v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-sea-regression:
    name: Open sea ecology, pressure and scenery contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Open Sea game modules
        run: |
          node --check public/abyssal-ocean-geography.js
          node --check public/abyssal-ocean-stream.js
          node --check public/abyssal-open-sea-ecology.js
          node --check public/abyssal-open-sea-render.js
          node --check public/abyssal-exploration-config.js
          node --check public/abyssal-inventory-ui.js
          node --check public/abyssal-resource-fields.js
          node --check public/abyssal-exploration-runtime.js
          node --check world-simulation.js
          node --check public/game.js
          node --check server.js
      - name: Run focused Open Sea regression suite
        run: node --test tests/ocean-ecosystem-integrity.test.cjs tests/ocean-geography.test.js tests/ocean-streaming.test.js tests/ocean-exploration-regression.test.js tests/ocean-specimen-respawn.test.cjs tests/mar-aberto-mining-inventory.test.cjs

  specimen-journal-acceptance:
    name: Specimens, journal and laboratory acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate game, server and specimen syntax
        run: |
          node --check public/abyssal-pet-tactics.js
          node --check public/abyssal-solo-cavern.js
          node --check public/specimen-system.js
          node --check public/rift-wildlife.js
          node --check public/game.js
          node --check server.js
          node --check scripts/browser-smoke.cjs
      - name: Validate Solo pet tactics and physical cave geometry
        run: node --test tests/pet-tactics-solo.test.cjs tests/solo-cavern-collisions.test.cjs
      - name: Validate biological data and independent visual themes
        run: node --test tests/specimen-journal-biology.test.cjs tests/creature-biological-scale.test.cjs tests/rift-wildlife-controls.test.cjs
      - name: Run focused Chromium journal, laboratory and specimen visual smoke
        run: node scripts/browser-smoke.cjs --journal-only
      - name: Upload visual acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abyssal-specimen-journal-acceptance
          path: test-artifacts/browser-smoke/journal-*.png
          if-no-files-found: warn
          retention-days: 3

  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Android configurator syntax
        run: |
          node --check scripts/configure-android.cjs
          node --check scripts/configure-android-direct-update.cjs
          node --check scripts/configure-android-signing.cjs
          node --check scripts/build-app-icons.cjs
      - name: Check JavaScript syntax and title definitions
        run: npm test
      - name: Check gameplay in real Chromium desktop and mobile viewports
        # Existing legacy unit assertions can fail without obscuring real visual regressions.
        if: always() && !cancelled()
        run: node scripts/browser-smoke.cjs
      - name: Upload Fossas visual smoke captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abyssal-fossas-visual-smoke
          path: test-artifacts/browser-smoke/*.png
          if-no-files-found: warn
          retention-days: 3

  android-api36:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Install server dependencies
        run: npm ci
      - name: Install Capacitor tooling
        run: npm install --no-save --package-lock=false @capacitor/core@8 @capacitor/android@8 @capacitor/cli@8 sharp@0.34.4
      - name: Generate Android project
        run: npx cap add android
      - name: Force API 36
        run: |
          sed -i "s/minSdkVersion = .*/minSdkVersion = 24/" android/variables.gradle
          sed -i "s/compileSdkVersion = .*/compileSdkVersion = 36/" android/variables.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = 36/" android/variables.gradle
      - name: Configure Android runtime
        run: node scripts/configure-android.cjs
      - name: Configure optional release signing
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            node scripts/configure-android-signing.cjs
          else
            echo "Play signing secrets not configured yet; debug APK will still be built."
          fi
      - name: Generate Android launcher icons and adaptive foreground
        run: node scripts/build-app-icons.cjs --android
      - name: Sync game assets
        run: npx cap sync android
      - name: Verify offline game is bundled inside Android app
        run: |
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/game.js
          test -s android/app/src/main/assets/public/offline-ui.js
          test -s android/app/src/main/assets/public/client-build.js
          test -s android/app/src/main/assets/public/update-manager.js
          test -s android/app/src/main/assets/public/update-manager.css
          test -s android/app/src/main/assets/public/abyssal-map.js
          cmp public/game.js android/app/src/main/assets/public/game.js
          cmp public/update-manager.js android/app/src/main/assets/public/update-manager.js
          grep -q 'Type.systemGestures()' android/app/src/main/java/com/esaneto/abyssal/MainActivity.java
          grep -q 'controller.show(WindowInsetsCompat.Type.systemBars())' android/app/src/main/java/com/esaneto/abyssal/MainActivity.java
          grep -q 'registerPlugin(AbyssalUpdaterPlugin.class)' android/app/src/main/java/com/esaneto/abyssal/MainActivity.java
          test -s android/app/src/main/java/com/esaneto/abyssal/AbyssalUpdaterPlugin.java
          test -s android/app/src/main/res/xml/abyssal_update_paths.xml
          if grep -q '"url"[[:space:]]*:[[:space:]]*"https://abyssal' capacitor.config.json; then
            echo "Android cannot use a remote-only server.url for offline solo" >&2
            exit 1
          fi
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Verify Android APK embeds the native anchor launcher
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > android-apk-badging.txt
          grep -q 'application-icon-' android-apk-badging.txt
          unzip -Z1 "$APK" > /tmp/abyssal-apk-files.txt
          grep -q 'ic_launcher_round' /tmp/abyssal-apk-files.txt
          grep -q 'ic_launcher_foreground' /tmp/abyssal-apk-files.txt
          ICON_PATH=$(grep -E "res/mipmap-xxhdpi(-v4)?/ic_launcher[.]png$" /tmp/abyssal-apk-files.txt | head -1)
          if [ -z "$ICON_PATH" ]; then echo "Missing native APK launcher PNG" >&2; exit 1; fi
          unzip -p "$APK" "$ICON_PATH" > /tmp/abyssal-apk-launcher.png
          node scripts/check-icon-pixels.cjs /tmp/abyssal-apk-launcher.png
      - name: Build stable signed APK for in-app updates
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        env:
          ABYSSAL_KEYSTORE_PATH: abyssal-upload.jks
          ABYSSAL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ABYSSAL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ABYSSAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/abyssal-upload.jks
          node scripts/configure-android-direct-update.cjs --enable
          cd android
          ./gradlew assembleRelease
          cd ..
          node scripts/configure-android-direct-update.cjs --disable

      - name: Validate unsigned release AAB
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: abyssal-android-api36-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
      - name: Upload unsigned release AAB validation artifact
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: abyssal-play-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 3
      - name: Prepare Play upload signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/abyssal-upload.jks
      - name: Verify Play manifest excludes sideload installer permission
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml; then
            echo "Play build must not request REQUEST_INSTALL_PACKAGES" >&2
            exit 1
          fi
      - name: Build signed Play release AAB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ABYSSAL_KEYSTORE_PATH: abyssal-upload.jks
          ABYSSAL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ABYSSAL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ABYSSAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - name: Upload signed Play AAB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: abyssal-play-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 3
      - name: Preserve Android build metadata
        run: |
          echo "commit=$GITHUB_SHA" > android-build.txt
          echo "targetSdk=36" >> android-build.txt
          echo "artifact=abyssal-android-api36-debug" >> android-build.txt
      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: abyssal-android-build-metadata
          path: android-build.txt
      - name: Promote validated APK to stable download release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CLIENT_VERSION=$(node -p "require('./package.json').version")
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -s android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk Abyssal-Android.apk
            UPDATABLE=true
            SIGNING=release
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk Abyssal-Android.apk
            UPDATABLE=false
            SIGNING=debug
          fi
          APK_SHA=$(sha256sum Abyssal-Android.apk | cut -d ' ' -f1)
          printf '{"version":"%s","commit":"%s","sha256":"%s","platform":"android","updatable":%s,"signing":"%s"}\n' "$CLIENT_VERSION" "$GITHUB_SHA" "$APK_SHA" "$UPDATABLE" "$SIGNING" > Abyssal-Android-build.json
          gh release upload downloads-2 Abyssal-Android.apk Abyssal-Android-build.json --clobber


  roxycloud-node26:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 26 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate RoxyCloud Ryzen runtime files
        run: |
          node --check server.js
          node --check state-persistence-worker.js
          node --check scripts/roxycloud-preflight.cjs
          node --test tests/roxycloud-readiness.test.cjs tests/specimen-journal-biology.test.cjs tests/creature-biological-scale.test.cjs tests/rift-wildlife-controls.test.cjs
