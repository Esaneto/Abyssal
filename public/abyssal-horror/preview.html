<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abyssal | Auditoria dos 13 inimigos</title>
<style>
:root{color-scheme:dark;font-family:system-ui, sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#173749,#06121f 62%,#030a12);color:#ddedf5;min-height:100vh}
header{padding:14px 20px;border-bottom:1px solid #31607077;background:#051522d9;position:sticky;top:0;z-index:2;display:flex;align-items:center;flex-wrap:wrap;gap:12px}h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.08em}header small{display:block;color:#a0bac9;font-size:11px;margin-top:2px}.controls{display:flex;gap:8px;margin-left:auto;align-items:center}button{background:#143747;border:1px solid #4a8499;border-radius:7px;color:#e9faff;padding:9px 13px;cursor:pointer;font-weight:bold}button[aria-pressed=true]{background:#285f6b;border-color:#8bdad7}.meta{font-size:12px;color:#afd3d2;padding:8px 20px 3px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:9px;padding:10px 18px 25px}article{background:radial-gradient(ellipse at 55% 45%,#173647,#081823 71%);border:1px solid #3e637280;border-radius:12px;overflow:hidden;position:relative}article h2{font:700 12px system-ui;letter-spacing:.07em;margin:8px 11px 0;color:#dceff4}canvas{display:block;width:100%;aspect-ratio:420/280;height:auto;object-fit:contain}article .status{font:11px system-ui;color:#7dc5d2;position:absolute;right:10px;top:8px}@media(max-width:500px){main{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:6px}article h2{font-size:10px}header{padding:8px}h1{font-size:14px}.controls{gap:4px}button{padding:7px 8px;font-size:12px}}
</style></head><body data-atlas-status="loading" data-atlas-ready="0">
<header><div><h1>ABYSSAL / ANIMAÇÕES</h1><small>Auditoria visual: nado e ataques, 13 inimigos</small></div><div class="controls"><button id="swim" aria-pressed="true">Nado</button><button id="attack" aria-pressed="false">Ataque</button></div></header>
<div class="meta" id="stat">Carregando os 26 atlas WebP...</div><main id="grid"></main>
<script>
'use strict';
const ids=['drifter','stinger','brute','lurker','whiteShark','boss','angler','maw','leviathan','whiteSharkBoss','kraken','devourer','riftSmile'];
const labels=['DRIFTER','STINGER','BRUTE','LURKER','TUBARÃO-BRANCO','BOSS','ANGLER','MAW','LEVIATHAN','TUBARÃO-BRANCO BOSS','KRAKEN','DEVOURER','RIFT SMILE'];
const gallery=document.getElementById('grid'),sprites=new Map();let mode='swim',lastStart=performance.now(),lastDraw=0;
for(let i=0;i<ids.length;i++){const id=ids[i],card=document.createElement('article');card.innerHTML='<h2>'+labels[i]+'</h2><span class="status">Carregando</span><canvas width="420" height="280"></canvas>';gallery.appendChild(card);sprites.set(id,{card,canvas:card.querySelector('canvas'),ctx:card.querySelector('canvas').getContext('2d'),images:{}});}
function load(url){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>image.naturalWidth===1680&&image.naturalHeight===1280?resolve(image):reject(Error('Dimensões inválidas '+url));image.onerror=()=>reject(Error('Não carregou '+url));image.src=url;});}
Promise.all(ids.map(async id=>{const item=sprites.get(id);item.images.swim=await load(id+'/swim.webp');item.images.attack=await load(id+'/attack.webp');item.card.querySelector('.status').textContent='OK';document.body.dataset.atlasReady=String(Number(document.body.dataset.atlasReady)+1);})).then(()=>{document.body.dataset.atlasStatus='ready';document.getElementById('stat').textContent='13 criaturas | 26 atlas | OK. Alternar Nado / Ataque.';}).catch(err=>{document.body.dataset.atlasStatus='error';document.getElementById('stat').textContent=String(err);});
for(const type of ['swim','attack'])document.getElementById(type).addEventListener('click',()=>{mode=type;lastStart=performance.now();for(const t of ['swim','attack'])document.getElementById(t).setAttribute('aria-pressed',String(mode===t));});
function drawImageFrame(ctx,img,frame,alpha){const col=frame%4,row=Math.floor(frame/4),scale=Math.min(420/420,280/320)*.99,w=420*scale,h=320*scale;ctx.globalAlpha=alpha;ctx.drawImage(img,col*420,row*320,420,320,(420-w)/2,(280-h)/2,w,h);}
function animate(t){if(t-lastDraw<62){requestAnimationFrame(animate);return;}lastDraw=t;let phase=((t-lastStart)/110)%15;const frame=Math.floor(phase),mix=phase-frame;for(const id of ids){const item=sprites.get(id),img=item.images[mode];if(!img)continue;const c=item.ctx;c.clearRect(0,0,420,280);c.save();c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';drawImageFrame(c,img,frame,1-mix);if(mix>.002)drawImageFrame(c,img,(frame+1)%15,mix);c.restore();}requestAnimationFrame(animate)}requestAnimationFrame(animate);
</script></body></html>
