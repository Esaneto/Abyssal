<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="abyssalIconTitle">
<title id="abyssalIconTitle">Abyssal: ancora de metal envolta por tentaculos roxos</title>
<defs>
  <radialGradient id="ocean" cx=".5" cy=".36" r=".78">
    <stop offset="0" stop-color="#132544"/><stop offset=".55" stop-color="#071528"/><stop offset="1" stop-color="#020610"/>
  </radialGradient>
  <radialGradient id="aura">
    <stop offset="0" stop-color="#6c2dcc" stop-opacity=".38"/><stop offset="1" stop-color="#511baf" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="metal" x1=".08" y1=".12" x2=".93" y2=".91">
    <stop offset="0" stop-color="#f6f6fc"/><stop offset=".23" stop-color="#bad1ed"/>
    <stop offset=".55" stop-color="#6786aa"/><stop offset=".77" stop-color="#c3cbe6"/><stop offset="1" stop-color="#435475"/>
  </linearGradient>
  <linearGradient id="tentacle" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d99bff"/><stop offset=".28" stop-color="#9e4cea"/><stop offset=".58" stop-color="#6b20b5"/><stop offset="1" stop-color="#2d0a69"/>
  </linearGradient>
  <linearGradient id="twilight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7b31d8"/><stop offset=".5" stop-color="#b36aff"/><stop offset="1" stop-color="#461484"/>
  </linearGradient>
  <filter id="violetGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="11"/>
  </filter>
  <filter id="metalShadow" x="-45%" y="-45%" width="190%" height="190%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#01030d" flood-opacity=".76"/>
  </filter>
</defs>
<g id="icon-background">
  <rect width="512" height="512" rx="98" fill="url(#ocean)"/>
  <circle cx="252" cy="245" r="205" fill="url(#aura)"/>
  <circle cx="256" cy="254" r="180" fill="none" stroke="#8541d5" stroke-opacity=".16" stroke-width="2"/>
  <circle cx="256" cy="254" r="215" fill="none" stroke="#967ae4" stroke-opacity=".12" stroke-width="2" stroke-dasharray="9 15"/>
  <path d="M55 351Q256 296 462 347M67 390Q255 326 443 398" stroke="#7487c9" stroke-opacity=".08" stroke-width="2" fill="none"/>
  <circle cx="86" cy="106" r="3" fill="#af8aff" opacity=".65"/><circle cx="426" cy="109" r="3" fill="#9dd7ff" opacity=".54"/>
  <circle cx="429" cy="401" r="2.6" fill="#b88aff" opacity=".73"/><circle cx="92" cy="403" r="2.6" fill="#9fd5ff" opacity=".48"/>
</g>
<!-- Roaming purple tentacles around the anchor, with distinct curled tips. -->
<g stroke-linecap="round" stroke-linejoin="round" fill="none">
  <path d="M94 446C53 402 58 342 93 303C125 266 108 236 128 203C152 162 185 164 188 136C191 109 171 102 162 118C153 132 169 144 179 134" stroke="#25103f" stroke-width="40"/>
  <path d="M94 446C53 402 58 342 93 303C125 266 108 236 128 203C152 162 185 164 188 136C191 109 171 102 162 118C153 132 169 144 179 134" stroke="url(#tentacle)" stroke-width="30"/>
  <path d="M104 429C75 387 81 350 109 314C139 273 129 247 144 218" stroke="#e5a3ff" stroke-opacity=".64" stroke-width="4"/>
  <path d="M424 449C465 408 453 348 418 314C384 281 402 238 380 210C361 187 337 189 324 169C306 140 320 125 334 130C350 134 348 150 335 151" stroke="#24103e" stroke-width="39"/>
  <path d="M424 449C465 408 453 348 418 314C384 281 402 238 380 210C361 187 337 189 324 169C306 140 320 125 334 130C350 134 348 150 335 151" stroke="url(#twilight)" stroke-width="29"/>
  <path d="M411 431C438 397 428 355 401 324C369 288 384 247 363 218" stroke="#e5adff" stroke-opacity=".48" stroke-width="3.5"/>
</g>
<!-- Small suckers make the arms read as octopus tentacles at icon size. -->
<g fill="#e7b4ff" stroke="#60208b" stroke-width="2.5">
  <ellipse cx="79" cy="382" rx="7" ry="9" transform="rotate(-18 79 382)"/>
  <ellipse cx="83" cy="346" rx="6" ry="8" transform="rotate(20 83 346)"/>
  <ellipse cx="109" cy="306" rx="6" ry="8" transform="rotate(38 109 306)"/>
  <ellipse cx="121" cy="268" rx="5" ry="7" transform="rotate(-8 121 268)"/>
  <ellipse cx="139" cy="225" rx="5" ry="6"/>
  <ellipse cx="446" cy="389" rx="7" ry="9" transform="rotate(19 446 389)"/>
  <ellipse cx="429" cy="350" rx="6" ry="8" transform="rotate(-15 429 350)"/>
  <ellipse cx="404" cy="319" rx="6" ry="8" transform="rotate(-25 404 319)"/>
  <ellipse cx="389" cy="282" rx="5" ry="7"/>
  <ellipse cx="378" cy="235" rx="5" ry="6"/>
</g>
<!-- Subtle light halo under the anchor. -->
<path d="M256 96V365" stroke="#8d5cf0" stroke-width="76" opacity=".22" filter="url(#violetGlow)" stroke-linecap="round"/>
<!-- Anchor is the dominant center silhouette. -->
<g filter="url(#metalShadow)" stroke-linejoin="round" stroke-linecap="round">
  <circle cx="256" cy="113" r="37" fill="#081329" stroke="#273757" stroke-width="19"/>
  <circle cx="256" cy="113" r="34" fill="#0b172e" stroke="url(#metal)" stroke-width="13"/>
  <path d="M256 154V362" stroke="#202a44" stroke-width="45"/>
  <path d="M256 154V362" stroke="url(#metal)" stroke-width="33"/>
  <path d="M176 225H336" stroke="#222c48" stroke-width="43"/>
  <path d="M176 225H336" stroke="url(#metal)" stroke-width="30"/>
  <path d="M149 313C155 374 194 405 237 385C248 379 255 367 256 359C257 367 264 379 275 385C318 405 357 374 363 313" fill="none" stroke="#202a44" stroke-width="44"/>
  <path d="M149 313C155 374 194 405 237 385C248 379 255 367 256 359C257 367 264 379 275 385C318 405 357 374 363 313" fill="none" stroke="url(#metal)" stroke-width="31"/>
  <path d="M154 274L102 338L168 321Z" fill="url(#metal)" stroke="#202a44" stroke-width="10"/>
  <path d="M358 274L410 338L344 321Z" fill="url(#metal)" stroke="#202a44" stroke-width="10"/>
  <path d="M249 162V357" stroke="#f3f5ff" stroke-opacity=".59" stroke-width="5"/>
  <path d="M183 217H328" stroke="#f3f5ff" stroke-opacity=".42" stroke-width="4"/>
  <path d="M139 328C156 390 197 411 239 379" fill="none" stroke="#e9f4ff" stroke-opacity=".42" stroke-width="4"/>
  <path d="M373 328C356 390 315 411 273 379" fill="none" stroke="#e9f4ff" stroke-opacity=".42" stroke-width="4"/>
</g>
<!-- One foreground curl partly overlaps the anchor, completing the embrace. -->
<path d="M155 424C199 443 210 398 245 391C271 385 281 406 298 413C328 425 343 401 331 390C319 378 307 390 316 400" fill="none" stroke="#211039" stroke-width="24" stroke-linecap="round"/>
<path d="M155 424C199 443 210 398 245 391C271 385 281 406 298 413C328 425 343 401 331 390C319 378 307 390 316 400" fill="none" stroke="url(#tentacle)" stroke-width="16" stroke-linecap="round"/>
<g fill="#e9bdff" opacity=".88"><circle cx="189" cy="422" r="4"/><circle cx="215" cy="403" r="3.5"/><circle cx="272" cy="391" r="3"/><circle cx="302" cy="411" r="3.2"/></g>
</svg>