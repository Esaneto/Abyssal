<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="oceanDepth" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0a2a3a"/>
      <stop offset="45%" stop-color="#041624"/>
      <stop offset="100%" stop-color="#01060d"/>
    </radialGradient>
    <linearGradient id="biolumRays" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#75f8ed"/>
      <stop offset="50%" stop-color="#2ee88a"/>
      <stop offset="100%" stop-color="#bd91ff"/>
    </linearGradient>
    <filter id="abyssGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base App Icon com cantos arredondados modernos estilo macOS/Android/PWA -->
  <rect width="512" height="512" rx="115" fill="url(#oceanDepth)" stroke="rgba(117,248,237,0.35)" stroke-width="4"/>

  <!-- Aneis Bionicos Abissais -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#2ee88a" stroke-opacity="0.15" stroke-width="3" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#75f8ed" stroke-opacity="0.25" stroke-width="3"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#bd91ff" stroke-opacity="0.20" stroke-width="2"/>

  <!-- Tentaculos e Barbatanas Abissais Fluindo no Fundo -->
  <path d="M120 380 Q 200 440 256 360 T 392 380" fill="none" stroke="#2ee88a" stroke-width="7" stroke-linecap="round" opacity="0.4"/>
  <path d="M100 290 Q 180 340 256 280 T 412 290" fill="none" stroke="#75f8ed" stroke-width="5" stroke-linecap="round" opacity="0.35"/>

  <!-- Silhueta Abissal Central: O Olho de Jade / Ferrão Primordial -->
  <path d="M256 70 L305 195 L435 256 L305 317 L256 442 L207 317 L77 256 L207 195 Z" fill="url(#biolumRays)" fill-opacity="0.18" stroke="url(#biolumRays)" stroke-width="8" stroke-linejoin="round" filter="url(#abyssGlow)"/>

  <!-- Mandíbula e Pupila Bioluminescente -->
  <path d="M175 256 C210 200 250 190 256 190 C262 190 302 200 337 256 C302 312 262 322 256 322 C250 322 210 312 175 256 Z" fill="#030c14" stroke="#75f8ed" stroke-width="8"/>
  
  <!-- Fenda de Energia Viva -->
  <ellipse cx="256" cy="256" rx="22" ry="38" fill="#2ee88a"/>
  <circle cx="256" cy="256" r="12" fill="#ffffff" filter="url(#abyssGlow)"/>

  <!-- Dentes e Faras da Criatura -->
  <path d="M220 256 L228 244 L236 256 L244 244 L252 256 M260 256 L268 244 L276 256 L284 244 L292 256" stroke="#a6fff5" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Partículas Bioluminescentes -->
  <circle cx="160" cy="150" r="5" fill="#75f8ed" opacity="0.8"/>
  <circle cx="355" cy="140" r="6" fill="#2ee88a" opacity="0.8"/>
  <circle cx="380" cy="360" r="4" fill="#bd91ff" opacity="0.7"/>
  <circle cx="140" cy="350" r="5" fill="#75f8ed" opacity="0.7"/>
  <circle cx="256" cy="465" r="4" fill="#2ee88a" opacity="0.9"/>
</svg>